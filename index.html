<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Auftragsbewertung · Clean Service</title>
<style>
/* Clean Service Scaramuzzo AG – internes App-Layout (/cs-app) · v1.0 · Sept. 2026 */
:root{
  --cs-tuerkis:#2BB6B7; --cs-tuerkis-dunkel:#1D8384; --cs-petrol:#0E4344; --cs-tuerkis-hell:#EAF6F6;
  --cs-text:#16292A; --cs-text-weich:#5E7273; --cs-rahmen:#E3ECEC; --cs-bg:#FBFCFC; --cs-karte:#FFFFFF;
  --cs-positiv:#2E9E5B; --cs-positiv-hell:#E7F5EC; --cs-negativ:#C1503D; --cs-negativ-hell:#FAEAE6;
  --cs-warnung:#C98A1B; --cs-warnung-hell:#FBF3E2;
  --cs-radius:10px; --cs-radius-s:6px; --cs-schatten:0 1px 2px rgba(22,41,42,.05);
  --cs-sidebar:248px; --cs-font:Verdana,Geneva,"DejaVu Sans",sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--cs-font);font-size:13px;line-height:1.55;color:var(--cs-text);background:var(--cs-bg);-webkit-font-smoothing:antialiased}
a{color:var(--cs-tuerkis-dunkel)}
:focus-visible{outline:2px solid var(--cs-tuerkis);outline-offset:2px}

/* App-Rahmen */
.app{display:grid;grid-template-columns:var(--cs-sidebar) 1fr;min-height:100vh}

/* Sidebar */
.sidebar{background:var(--cs-petrol);color:#CFE6E6;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{padding:22px 20px 18px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand-logo{display:block;max-width:168px;height:auto;background:#fff;border-radius:var(--cs-radius-s);padding:8px 10px}
.brand-logo.platzhalter{height:52px;display:grid;place-items:center;color:var(--cs-tuerkis-dunkel);font-size:10px;letter-spacing:.04em}
.brand-app{margin-top:12px;font-size:12px;color:#fff;font-weight:bold}
.nav{padding:14px 10px;display:flex;flex-direction:column;gap:2px}
.nav-titel{font-size:10.5px;color:#7FA9AA;padding:14px 12px 6px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--cs-radius-s);color:#CFE6E6;text-decoration:none;font-size:12.5px}
.nav a svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.75;flex:none}
.nav a:hover{background:rgba(255,255,255,.06);color:#fff}
.nav a.aktiv{background:var(--cs-tuerkis);color:#fff}
.sidebar-fuss{margin-top:auto;padding:16px 20px;font-size:11px;color:#7FA9AA;border-top:1px solid rgba(255,255,255,.08)}

/* Hauptbereich */
.main{padding:28px 36px 48px;min-width:0}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px;padding-bottom:18px;border-bottom:1px solid var(--cs-rahmen)}
.page-head h1{margin:0;font-size:22px;letter-spacing:-.01em}
.page-head p{margin:4px 0 0;color:var(--cs-text-weich)}
.page-actions{display:flex;gap:8px;flex-wrap:wrap}

/* KPI-Zeile */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:24px}
.kpi{background:var(--cs-karte);border:1px solid var(--cs-rahmen);border-top:3px solid var(--cs-tuerkis);border-radius:var(--cs-radius);padding:16px 18px;box-shadow:var(--cs-schatten)}
.kpi.positiv{border-top-color:var(--cs-positiv)} .kpi.negativ{border-top-color:var(--cs-negativ)} .kpi.warnung{border-top-color:var(--cs-warnung)}
.kpi-label{font-size:11.5px;color:var(--cs-text-weich)}
.kpi-wert{font-size:26px;font-weight:bold;margin-top:6px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi-trend{font-size:11.5px;margin-top:4px}
.kpi-trend.hoch{color:var(--cs-positiv)} .kpi-trend.tief{color:var(--cs-negativ)}

/* Karten */
.grid{display:grid;gap:16px}
.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))} .grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{background:var(--cs-karte);border:1px solid var(--cs-rahmen);border-radius:var(--cs-radius);box-shadow:var(--cs-schatten);overflow:hidden}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px;background:var(--cs-tuerkis-hell);border-bottom:1px solid var(--cs-rahmen)}
.card-head h2{margin:0;font-size:13.5px;color:var(--cs-tuerkis-dunkel)}
.card-body{padding:18px}

/* Tabellen */
.table-wrap{overflow-x:auto}
.table{width:100%;border-collapse:collapse;font-size:12.5px}
.table th{background:var(--cs-tuerkis-hell);color:var(--cs-tuerkis-dunkel);font-weight:bold;text-align:left;padding:10px 14px;white-space:nowrap;border-bottom:1px solid var(--cs-rahmen)}
.table td{padding:10px 14px;border-bottom:1px solid var(--cs-rahmen);vertical-align:middle}
.table th.zahl,.table td.zahl{text-align:right;font-variant-numeric:tabular-nums}
.table tbody tr:hover{background:#F6FAFA}
.table tr.dringend td:first-child{box-shadow:inset 4px 0 0 var(--cs-negativ)}
.table tr.hinweis td:first-child{box-shadow:inset 4px 0 0 var(--cs-warnung)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:36px;padding:0 16px;border-radius:var(--cs-radius-s);border:1px solid var(--cs-rahmen);background:#fff;color:var(--cs-text);font:inherit;font-size:12.5px;cursor:pointer;text-decoration:none}
.btn:hover{border-color:var(--cs-tuerkis);color:var(--cs-tuerkis-dunkel)}
.btn.primary-action{background:var(--cs-tuerkis-dunkel);border-color:var(--cs-tuerkis-dunkel);color:#fff;font-weight:bold}
.btn.primary-action:hover{background:var(--cs-petrol);border-color:var(--cs-petrol);color:#fff}
.btn.secondary{background:var(--cs-tuerkis-hell);border-color:transparent;color:var(--cs-tuerkis-dunkel)}
.btn.gefahr{color:var(--cs-negativ)} .btn.gefahr:hover{border-color:var(--cs-negativ)}
.btn.gross{min-height:48px;font-size:14px;padding:0 22px}

/* Tags */
.tag{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:bold;background:var(--cs-tuerkis-hell);color:var(--cs-tuerkis-dunkel);white-space:nowrap}
.tag.positiv{background:var(--cs-positiv-hell);color:var(--cs-positiv)} .tag.negativ{background:var(--cs-negativ-hell);color:var(--cs-negativ)} .tag.warnung{background:var(--cs-warnung-hell);color:#8F6212}

/* Formulare */
.feld{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.feld label{font-size:12px;font-weight:bold}
.feld input,.feld select,.feld textarea{font:inherit;font-size:13px;padding:9px 12px;min-height:40px;border:1px solid var(--cs-rahmen);border-radius:var(--cs-radius-s);background:#fff;color:var(--cs-text)}
.feld input:focus,.feld select:focus,.feld textarea:focus{border-color:var(--cs-tuerkis);outline:none;box-shadow:0 0 0 3px rgba(43,182,183,.18)}
.feld .hilfe{font-size:11.5px;color:var(--cs-text-weich)}

/* Zustände */
.leer{padding:40px 20px;text-align:center;color:var(--cs-text-weich)}
.hinweisbox{padding:12px 16px;border-radius:var(--cs-radius-s);border-left:4px solid var(--cs-tuerkis);background:var(--cs-tuerkis-hell);margin-bottom:16px}
.hinweisbox.warnung{border-color:var(--cs-warnung);background:var(--cs-warnung-hell)}
.hinweisbox.negativ{border-color:var(--cs-negativ);background:var(--cs-negativ-hell)}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(14,67,68,.45);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
.modal-overlay.offen{display:flex}
.modal{background:#fff;border-radius:12px;width:min(560px,100%);max-height:90vh;overflow:auto;box-shadow:0 20px 50px rgba(14,67,68,.25)}
.modal-head{padding:16px 20px;border-bottom:1px solid var(--cs-rahmen);display:flex;justify-content:space-between;align-items:center}
.modal-head h3{margin:0;font-size:15px}
.modal-body{padding:20px} .modal-fuss{padding:14px 20px;border-top:1px solid var(--cs-rahmen);display:flex;justify-content:flex-end;gap:8px}

/* Mobile */
.menu-toggle{display:none}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;inset:0 auto 0 0;width:min(280px,85vw);transform:translateX(-100%);transition:transform .2s;z-index:40}
  .sidebar.offen{transform:none}
  .menu-toggle{display:inline-flex}
  .main{padding:18px 16px 40px}
  .page-head{flex-direction:column;align-items:flex-start}
  .grid-2,.grid-3{grid-template-columns:1fr}
}
@media print{
  .sidebar,.page-actions,.menu-toggle{display:none!important}
  .app{display:block} .main{padding:0} body{background:#fff;font-family:"DejaVu Sans",Verdana,sans-serif}
  .card,.kpi{box-shadow:none;break-inside:avoid}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

</style>
<style>
/* App-spezifische Ergänzungen – nur mit var(--cs-*) */
.sidebar-liste{padding:0 10px 8px;display:flex;flex-direction:column;gap:2px}
.sidebar-liste a{display:flex;align-items:baseline;justify-content:space-between;gap:8px;
  padding:8px 12px;border-radius:var(--cs-radius-s);color:#CFE6E6;text-decoration:none;font-size:12px}
.sidebar-liste a:hover{background:rgba(255,255,255,.06);color:#fff}
.sidebar-liste a.aktiv{background:rgba(255,255,255,.10);color:#fff}
.sidebar-liste .wert{font-size:11px;color:#7FA9AA;font-variant-numeric:tabular-nums;white-space:nowrap}
.sidebar-liste .wert.negativ{color:#E8A599}
.sidebar-leer{padding:4px 22px 10px;font-size:11px;color:#7FA9AA}

.reiter{display:flex;gap:22px;border-bottom:1px solid var(--cs-rahmen);margin-bottom:16px;overflow-x:auto}
.reiter button{background:none;border:0;cursor:pointer;font:inherit;font-size:12.5px;
  color:var(--cs-text-weich);padding:10px 0;margin-bottom:-1px;border-bottom:2px solid transparent;white-space:nowrap}
.reiter button.aktiv{color:var(--cs-tuerkis-dunkel);font-weight:bold;border-bottom-color:var(--cs-tuerkis)}

.band{margin-bottom:16px}
.band:last-child{margin-bottom:0}
.band-kopf{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:6px;font-size:12px}
.band-kopf .name{font-weight:bold}
.band-kopf .zahlen{color:var(--cs-text-weich);font-variant-numeric:tabular-nums}
.band-kopf .zahlen b{color:var(--cs-text)}
.band-spur{position:relative;height:12px;background:var(--cs-tuerkis-hell);
  border:1px solid var(--cs-rahmen);border-radius:var(--cs-radius-s);overflow:hidden}
.band-fuellung{position:absolute;top:0;bottom:0;left:0;background:var(--cs-tuerkis)}
.band-fuellung.warnung{background:var(--cs-warnung)}
.band-fuellung.negativ{background:var(--cs-negativ)}
.band-ueber{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,var(--cs-negativ) 0 5px,#D57566 5px 10px)}
.band-marke{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--cs-text)}
.band-fuss{margin-top:4px;font-size:11px;color:var(--cs-text-weich)}
.band.klein .band-kopf,.band.klein .band-fuss{display:none}
.band.klein{margin:0;min-width:90px}
.band.klein .band-spur{height:8px}

.note-wert{display:inline-grid;place-items:center;min-width:28px;height:28px;padding:0 8px;
  border-radius:var(--cs-radius-s);font-weight:bold;font-size:13px;color:#fff;background:var(--cs-text-weich)}
.note-wert.a{background:var(--cs-positiv)} .note-wert.b{background:var(--cs-tuerkis-dunkel)}
.note-wert.c{background:var(--cs-warnung)} .note-wert.d{background:var(--cs-negativ)}

.teilnote{padding:10px 0;border-top:1px solid var(--cs-rahmen)}
.teilnote-kopf{display:flex;justify-content:space-between;gap:10px;font-size:12px}
.teilnote-bar{height:5px;background:var(--cs-tuerkis-hell);border-radius:999px;margin:6px 0 4px;overflow:hidden}
.teilnote-bar i{display:block;height:100%;background:var(--cs-tuerkis-dunkel)}
.teilnote-bar i.positiv{background:var(--cs-positiv)}
.teilnote-bar i.warnung{background:var(--cs-warnung)}
.teilnote-bar i.negativ{background:var(--cs-negativ)}
.teilnote .quelle{font-size:11px;color:var(--cs-text-weich)}

.erfassung .feld input,.erfassung .feld select{min-height:48px;font-size:15px}
.erfassung .btn.primary-action{width:100%;min-height:48px;font-size:14px}
.pruef{display:flex;align-items:center;gap:10px;font-size:12.5px;margin-bottom:14px;cursor:pointer;min-height:44px}
.pruef input{width:20px;height:20px;accent-color:var(--cs-tuerkis-dunkel)}

.briefkopf{display:none}
.briefkopf .bk-oben{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;
  padding-bottom:10px;border-bottom:2px solid var(--cs-tuerkis)}
.briefkopf .bk-bild{display:block;width:58mm;height:auto}
.briefkopf .bk-claim,.briefkopf .bk-adresse{font-size:10px;color:var(--cs-text-weich)}
.briefkopf .bk-adresse{text-align:right;line-height:1.5}
.briefkopf .bk-sparten{display:flex;gap:12px;flex-wrap:wrap;padding-top:6px;font-size:9.5px;color:var(--cs-text-weich)}
.briefkopf .bk-titel{margin-top:24px}
.briefkopf .bk-titel h1{margin:0;font-size:18px}
.briefkopf .bk-titel p{margin:3px 0 0;font-size:11px;color:var(--cs-text-weich)}
@media print{ .briefkopf{display:block;margin-bottom:10mm} .reiter,.page-head{display:none} }
</style>
</head>

/* ---------- Zustand ---------- */
let state = Store.load() || seed();
let ui = { ansicht:'portfolio', auftragId:state.auftraege[0]?.id || null, tab:'bau' };
function save(){ Store.save(state); }
function auftrag(){ return state.auftraege.find(a => a.id === ui.auftragId) || null; }

/* ---------- Rechnen ---------- */
function blockWerte(b){
  const soll = b.positionen.length ? b.positionen.reduce((s,p) => s + num(p.soll), 0) : num(b.sollPauschal);
  const ist  = b.ausfuehrungen.reduce((s,a) => s + num(a.stunden), 0);
  const verrechenbar = b.ausfuehrungen.filter(a => a.enthalten || a.genehmigt).reduce((s,a) => s + num(a.stunden), 0);
  const quote = soll > 0 ? ist/soll : 0;
  return { soll, ist, verrechenbar, nichtVerrechenbar: ist - verrechenbar, rest: soll - ist, quote,
    status: ist === 0 ? 'offen' : quote > 1 ? 'negativ' : quote > 0.9 ? 'warnung' : 'positiv' };
}

function auftragWerte(a){
  const per = {}; let soll=0, ist=0, verrechenbar=0, ausf=0, dokOk=0;
  a.bloecke.forEach(b => {
    const w = blockWerte(b); per[b.key] = w;
    soll += w.soll; ist += w.ist; verrechenbar += w.verrechenbar;
    b.ausfuehrungen.forEach(x => { ausf++; if(x.datum && num(x.stunden) > 0 && (x.enthalten || x.genehmigt) && x.bemerkung) dokOk++; });
  });
  const nichtVerrechenbar = ist - verrechenbar;
  const rateSell = num(a.rateSell) || num(state.settings.rateSell);
  const rateCost = num(a.rateCost) || num(state.settings.rateCost);
  const ertrag = verrechenbar * rateSell, kosten = ist * rateCost;

  const ueber      = soll > 0 ? Math.max(0, ist/soll - 1) : 0;
  const pDisziplin = soll > 0 ? 100 * Math.max(0, 1 - ueber/0.30) : 100;
  const pVerrech   = ist > 0 ? 100 * (verrechenbar/ist) : 100;
  const nachQuote  = per.bau.ist > 0 ? per.nach.ist/per.bau.ist : 0;
  const pNach      = 100 * Math.max(0, 1 - nachQuote/0.10);
  const pDok       = ausf > 0 ? 100 * (dokOk/ausf) : 100;
  const score = 0.40*pDisziplin + 0.30*pVerrech + 0.20*pNach + 0.10*pDok;

  return { per, soll, ist, verrechenbar, nichtVerrechenbar, rest: soll - ist,
    quote: soll > 0 ? ist/soll : 0, rateSell, rateCost, ertrag, kosten,
    deckungsbeitrag: ertrag - kosten, risiko: nichtVerrechenbar * rateSell,
    ausf, dokOk, teil:{ disziplin:pDisziplin, verrech:pVerrech, nach:pNach, dok:pDok },
    score, note: score >= 85 ? 'A' : score >= 70 ? 'B' : score >= 55 ? 'C' : 'D',
    bewertbar: ist > 0, reife: soll > 0 ? ist/soll : 0, vorlaeufig: soll > 0 && ist/soll < 0.5 };
}

/* ---------- Bausteine ---------- */
function band(titel, w, klein){
  const max  = Math.max(w.soll, w.ist) || 1;
  const fuel = Math.min(w.ist, w.soll)/max*100;
  const ueber= w.ist > w.soll ? (w.ist - w.soll)/max*100 : 0;
  const marke= w.soll/max*100;
  const cls  = w.status === 'negativ' ? ' negativ' : w.status === 'warnung' ? ' warnung' : '';
  return `<div class="band${klein ? ' klein' : ''}">
    ${klein ? '' : `<div class="band-kopf">
      <span class="name">${esc(titel)}</span>
      <span class="zahlen"><b>${h(w.ist)}</b> / ${h(w.soll)} h · ${pz(w.quote*100)} %</span>
    </div>`}
    <div class="band-spur">
      <div class="band-fuellung${cls}" style="width:${fuel}%"></div>
      ${ueber > 0 ? `<div class="band-ueber" style="left:${marke}%;width:${ueber}%"></div>
      <div class="band-marke" style="left:calc(${marke}% - 1px)"></div>` : ''}
    </div>
    ${klein ? '' : `<div class="band-fuss">${w.ist > w.soll
      ? 'Über Soll: ' + h(w.ist - w.soll) + ' h'
      : 'Verbleibend: ' + h(w.soll - w.ist) + ' h'}</div>`}
  </div>`;
}

function tag(status){
  const m = { positiv:['positiv','Im Rahmen'], warnung:['warnung','Kritisch'],
              negativ:['negativ','Überschritten'], offen:['','Nicht begonnen'] };
  const [c,t] = m[status] || m.offen;
  return `<span class="tag ${c}">${t}</span>`;
}

function kpi(wert, label, trend, mod){
  return `<div class="kpi ${mod || ''}">
    <div class="kpi-label">${esc(label)}</div>
    <div class="kpi-wert">${wert}</div>
    ${trend ? `<div class="kpi-trend">${trend}</div>` : ''}
  </div>`;
}

/* ---------- Sidebar ---------- */
function renderSidebar(){
  const items = [['portfolio','Portfolio'],['auftrag','Auftrag'],['erfassung','Stunden erfassen'],['bericht','Bewertung']];
  document.getElementById('nav').innerHTML =
    items.map(([k,t]) => `<a href="#" class="${ui.ansicht===k?'aktiv':''}" onclick="go('${k}');return false">${ICON[k]}${t}</a>`).join('') +
    `<div class="nav-titel">Verwaltung</div>` +
    `<a href="#" class="${ui.ansicht==='einstellungen'?'aktiv':''}" onclick="go('einstellungen');return false">${ICON.einstellungen}Einstellungen</a>`;

  document.getElementById('sidebarListe').innerHTML = state.auftraege.length
    ? state.auftraege.map(a => {
        const w = auftragWerte(a);
        return `<a href="#" class="${a.id===ui.auftragId?'aktiv':''}" onclick="oeffne('${a.id}');return false">
          <span>${esc(a.objekt || 'Ohne Namen')}</span>
          <span class="wert ${w.quote>1?'negativ':''}">${h(w.ist)}/${h(w.soll)}</span></a>`;
      }).join('')
    : '<div class="sidebar-leer">Noch keine Baustelle</div>';

  const tot = state.auftraege.reduce((s,a) => { const w = auftragWerte(a); s.soll += w.soll; s.ist += w.ist; return s; }, {soll:0,ist:0});
  document.getElementById('sidebarFuss').innerHTML =
    `Clean Service Scaramuzzo AG<br>Spezialreinigung<br><br>${h(tot.ist)} von ${h(tot.soll)} h geleistet`;
}

function kopfZeile(titel, unter, aktionen){
  return `<header class="page-head">
    <div>
      <button class="btn menu-toggle" onclick="document.getElementById('sidebar').classList.toggle('offen')" aria-label="Menü">Menü</button>
      <h1>${esc(titel)}</h1>
      <p>${unter}</p>
    </div>
    <div class="page-actions">${aktionen || ''}</div>
  </header>`;
}

/* ---------- Portfolio ---------- */
function ansichtPortfolio(){
  if(!state.auftraege.length){
    return kopfZeile('Portfolio','Noch keine Baustelle erfasst','') + `
    <section class="card"><div class="leer">
      <h2 style="margin:0 0 6px;font-size:15px;color:var(--cs-text)">Noch keine Baustelle erfasst</h2>
      <p style="margin:0 0 18px">Legen Sie den ersten Auftrag an, um verkaufte und geleistete Stunden zu vergleichen.</p>
      <button class="btn primary-action" onclick="auftragDialog()">Auftrag anlegen</button>
    </div></section>`;
  }
  const tot = state.auftraege.reduce((s,a) => {
    const w = auftragWerte(a);
    s.soll+=w.soll; s.ist+=w.ist; s.nv+=w.nichtVerrechenbar; s.db+=w.deckungsbeitrag; s.risiko+=w.risiko; return s;
  }, {soll:0,ist:0,nv:0,db:0,risiko:0});

  const zeilen = state.auftraege.map(a => {
    const w = auftragWerte(a);
    const kl = w.quote > 1 ? ' class="dringend"' : w.nichtVerrechenbar > 0 ? ' class="hinweis"' : '';
    return `<tr${kl} style="cursor:pointer" onclick="oeffne('${a.id}')">
      <td><strong>${esc(a.objekt)}</strong><div style="font-size:11px;color:var(--cs-text-weich)">${esc(a.auftraggeber || '—')}</div></td>
      <td>${esc(a.bl || '—')}</td>
      <td class="zahl">${h(w.soll)}</td>
      <td class="zahl">${h(w.ist)}</td>
      <td style="min-width:110px">${band('', w, true)}</td>
      <td class="zahl">${w.nichtVerrechenbar > 0 ? chfk(w.risiko) : '—'}</td>
      <td>${w.bewertbar ? `<span class="note-wert ${w.note.toLowerCase()}">${w.note}</span>` : tag('offen')}</td>
    </tr>`;
  }).join('');

  return kopfZeile('Portfolio','Alle Baustellen mit Stundenstand, Verrechenbarkeit und Note',
    `<button class="btn primary-action" onclick="auftragDialog()">Auftrag anlegen</button>`) + `

  <section class="kpis">
    ${kpi(h(tot.soll) + ' h','Verkaufte Stunden')}
    ${kpi(h(tot.ist) + ' h','Geleistete Stunden', pz(tot.soll ? tot.ist/tot.soll*100 : 0) + ' % des Volumens')}
    ${kpi(h(tot.nv) + ' h','Nicht verrechenbar', tot.risiko > 0 ? chf(tot.risiko) + ' Risiko' : 'alles gedeckt', tot.nv > 0 ? 'negativ' : 'positiv')}
    ${kpi(chf(tot.db),'Deckungsbeitrag bis heute', null, tot.db >= 0 ? 'positiv' : 'negativ')}
  </section>

  <section class="card">
    <div class="card-head"><h2>Baustellen</h2><span class="tag">${state.auftraege.length} Aufträge</span></div>
    <div class="table-wrap"><table class="table">
      <thead><tr><th>Baustelle</th><th>Bauleitung</th><th class="zahl">Soll h</th><th class="zahl">Ist h</th>
        <th>Verlauf</th><th class="zahl">Risiko CHF</th><th>Note</th></tr></thead>
      <tbody>${zeilen}</tbody>
    </table></div>
  </section>

  <div class="hinweisbox" style="margin-top:16px">
    Der Deckungsbeitrag rechnet mit ${chf(state.settings.rateSell)} Verrechnungssatz und ${chf(state.settings.rateCost)}
    Kostensatz pro Stunde. Beides sind Annahmen und in den Einstellungen zu hinterlegen, bevor die Zahl gegenüber der GL verwendet wird.
  </div>`;
}

/* ---------- Auftrag ---------- */
function ansichtAuftrag(){
  const a = auftrag();
  if(!a) return kopfZeile('Auftrag','Kein Auftrag gewählt','') +
    `<section class="card"><div class="leer">Wählen Sie links eine Baustelle.</div></section>`;
  const w = auftragWerte(a);
  const b = a.bloecke.find(x => x.key === ui.tab) || a.bloecke[0];
  const bw = blockWerte(b);

  const reiter = a.bloecke.map(x => {
    const v = blockWerte(x);
    return `<button class="${x.key===ui.tab?'aktiv':''}" onclick="ui.tab='${x.key}';render()">${esc(x.name)}
      <span style="color:var(--cs-text-weich);font-variant-numeric:tabular-nums">${h(v.ist)}/${h(v.soll)}</span></button>`;
  }).join('');

  const posZeilen = b.positionen.map(p => {
    const ist = b.ausfuehrungen.filter(x => x.posId === p.id).reduce((s,x) => s + num(x.stunden), 0);
    const q = num(p.soll) > 0 ? ist/num(p.soll) : 0;
    const st = ist === 0 ? 'offen' : q > 1 ? 'negativ' : q > 0.9 ? 'warnung' : 'positiv';
    return `<tr${st==='negativ'?' class="dringend"':''}>
      <td>${esc(p.name)}</td><td class="zahl">${h(p.soll)}</td><td class="zahl">${ist ? h(ist) : '—'}</td>
      <td class="zahl">${ist ? h(num(p.soll)-ist) : '—'}</td><td>${tag(st)}</td>
      <td><button class="btn gefahr" style="min-height:28px;padding:0 10px" onclick="posLoeschen('${b.key}','${p.id}')">Entfernen</button></td>
    </tr>`;
  }).join('');

  const ausZeilen = b.ausfuehrungen.slice().sort((x,y) => (y.datum||'').localeCompare(x.datum||'')).map(x => {
    const p = b.positionen.find(pp => pp.id === x.posId);
    const gedeckt = x.enthalten || x.genehmigt;
    return `<tr${gedeckt?'':' class="dringend"'}>
      <td>${dch(x.datum)}</td><td>${esc(p ? p.name : b.name)}</td><td class="zahl">${h(x.stunden)}</td>
      <td>${x.enthalten ? 'ja' : 'nein'}</td><td>${x.genehmigt ? 'ja' : 'nein'}</td>
      <td>${gedeckt ? '<span class="tag positiv">verrechenbar</span>' : '<span class="tag negativ">nicht gedeckt</span>'}</td>
      <td style="font-size:11px;color:var(--cs-text-weich)">${esc(x.bemerkung || '')}</td>
      <td><button class="btn gefahr" style="min-height:28px;padding:0 10px" onclick="ausLoeschen('${b.key}','${x.id}')">Entfernen</button></td>
    </tr>`;
  }).join('');

  return kopfZeile(a.objekt || 'Ohne Bezeichnung',
    `${esc(a.adresse || '—')} · Auftraggeber ${esc(a.auftraggeber || '—')} · Bauleitung ${esc(a.bl || '—')} · ${esc(a.sparte)}`,
    `<button class="btn" onclick="auftragDialog('${a.id}')">Stammdaten</button>
     <button class="btn" onclick="go('bericht')">Bewertung</button>
     <button class="btn primary-action" onclick="erfassenDialog('${b.key}')">Stunden erfassen</button>`) + `

  <section class="kpis">
    ${kpi(h(w.soll) + ' h','Verkauft')}
    ${kpi(h(w.ist) + ' h','Geleistet', pz(w.quote*100) + ' % verbraucht')}
    ${kpi(h(w.rest) + ' h','Verbleibend', null, w.rest < 0 ? 'negativ' : 'positiv')}
    ${kpi(w.bewertbar ? Math.round(w.score) : '—',
       w.bewertbar && w.vorlaeufig ? 'Zwischenstand · Note ' + w.note : 'Bewertung' + (w.bewertbar ? ' · Note ' + w.note : ''),
       null, w.bewertbar ? (w.score>=70?'positiv':w.score>=55?'warnung':'negativ') : '')}
  </section>

  <section class="card" style="margin-bottom:16px">
    <div class="card-head"><h2>Stundenstand nach Leistung</h2></div>
    <div class="card-body">${a.bloecke.map(x => band(x.name, blockWerte(x))).join('')}</div>
  </section>

  <div class="reiter">${reiter}</div>

  <section class="card" style="margin-bottom:16px">
    <div class="card-head"><h2>${esc(b.name)}</h2>${tag(bw.status)}</div>
    <div class="card-body">
      <section class="kpis" style="margin-bottom:0">
        ${kpi(h(bw.soll) + ' h','Zur Verfügung')}
        ${kpi(h(bw.ist) + ' h','Benötigt')}
        ${kpi(h(bw.rest) + ' h','Noch verfügbar', null, bw.rest < 0 ? 'negativ' : '')}
        ${kpi((bw.nichtVerrechenbar > 0 ? h(bw.nichtVerrechenbar) : '0.0') + ' h','Nicht verrechenbar', null, bw.nichtVerrechenbar > 0 ? 'negativ' : '')}
      </section>
    </div>
  </section>

  <section class="card" style="margin-bottom:16px">
    <div class="card-head"><h2>Positionen</h2>
      <button class="btn secondary" onclick="posDialog('${b.key}')">Position hinzufügen</button></div>
    ${b.positionen.length ? `
    <div class="table-wrap"><table class="table">
      <thead><tr><th>Position</th><th class="zahl">Soll h</th><th class="zahl">Ist h</th><th class="zahl">Differenz</th><th>Status</th><th></th></tr></thead>
      <tbody>${posZeilen}</tbody>
      <tfoot><tr><th>Total</th><th class="zahl">${h(bw.soll)}</th><th class="zahl">${h(bw.ist)}</th><th class="zahl">${h(bw.rest)}</th><th colspan="2"></th></tr></tfoot>
    </table></div>` : `
    <div class="card-body">
      <div class="feld" style="max-width:300px;margin:0">
        <label for="pausch">Stunden zur Verfügung (pauschal)</label>
        <input id="pausch" type="number" step="0.25" value="${b.sollPauschal}" onchange="setzePauschal('${b.key}', this.value)">
        <span class="hilfe">Ohne Einzelpositionen, zum Beispiel Regie gemäss Werkvertrag.</span>
      </div>
    </div>`}
  </section>

  <section class="card">
    <div class="card-head"><h2>Ausführungen und Rapporte</h2>
      <button class="btn secondary" onclick="erfassenDialog('${b.key}')">Stunden erfassen</button></div>
    ${b.ausfuehrungen.length ? `
    <div class="table-wrap"><table class="table">
      <thead><tr><th>Datum</th><th>Position</th><th class="zahl">Stunden</th><th>Im Auftrag</th>
        <th>Rapport genehmigt</th><th>Verrechenbar</th><th>Bemerkung</th><th></th></tr></thead>
      <tbody>${ausZeilen}</tbody>
      <tfoot><tr><th>Total geleistet</th><th></th><th class="zahl">${h(bw.ist)}</th><th colspan="5"></th></tr></tfoot>
    </table></div>` : `
    <div class="leer">Keine Stunden erfasst. Sobald die Bauleitung Rapporte liefert, werden sie hier eingetragen.</div>`}
  </section>

  ${bw.nichtVerrechenbar > 0 ? `<div class="hinweisbox negativ" style="margin-top:16px">
    ${h(bw.nichtVerrechenbar)} Stunden in diesem Block sind weder im Auftrag enthalten noch durch einen genehmigten
    Rapport gedeckt. Das entspricht rund ${chf(bw.nichtVerrechenbar * w.rateSell)}, die ohne Nachtrag nicht fakturiert werden können.
  </div>` : ''}`;
}

/* ---------- Bewertung ---------- */
function ansichtBericht(){
  const a = auftrag();
  if(!a) return kopfZeile('Bewertung','Kein Auftrag gewählt','') +
    `<section class="card"><div class="leer">Wählen Sie links eine Baustelle.</div></section>`;
  const w = auftragWerte(a);
  const teile = [
    ['Stundendisziplin', w.teil.disziplin, 40, `Ist ${h(w.ist)} h gegen Soll ${h(w.soll)} h`],
    ['Verrechenbarkeit', w.teil.verrech, 30, `${h(w.verrechenbar)} von ${h(w.ist)} h gedeckt`],
    ['Nacharbeit', w.teil.nach, 20, `Nachreinigung ${h(w.per.nach.ist)} h zu Baureinigung ${h(w.per.bau.ist)} h`],
    ['Dokumentation', w.teil.dok, 10, `${w.dokOk} von ${w.ausf} Ausführungen vollständig`]
  ];

  return briefkopf('Auftragsbewertung ' + (a.objekt || ''), (a.adresse || '') + ' · Stand ' + dch(heute())) +
  kopfZeile('Bewertung ' + a.objekt,
    `Stand ${dch(heute())} · Verrechnungssatz ${chf(w.rateSell)} · Kostensatz ${chf(w.rateCost)}`,
    `<button class="btn" onclick="go('auftrag')">Zurück</button>
     <button class="btn primary-action" onclick="window.print()">Als PDF drucken</button>`) + `

  ${!w.bewertbar ? `<div class="hinweisbox warnung">
    Für diesen Auftrag sind noch keine Stunden erfasst. Die Bewertung wird erst mit dem ersten Rapport aussagekräftig.
  </div>` : w.vorlaeufig ? `<div class="hinweisbox">
    Erst ${pz(w.reife*100)} Prozent der verkauften Stunden sind geleistet. Die Note ist ein Zwischenstand und sagt
    bisher vor allem, dass der Auftrag im Rahmen läuft.
  </div>` : ''}

  <div class="grid grid-2" style="grid-template-columns:minmax(0,1fr) 340px;align-items:start">
    <div class="grid">
      <section class="card">
        <div class="card-head"><h2>Stundenstand nach Leistung</h2></div>
        <div class="card-body">${a.bloecke.map(x => band(x.name, blockWerte(x))).join('')}</div>
      </section>

      <section class="card">
        <div class="card-head"><h2>Zusammenzug</h2></div>
        <div class="table-wrap"><table class="table">
          <thead><tr><th>Leistung</th><th class="zahl">Soll h</th><th class="zahl">Ist h</th><th class="zahl">Verbleibend</th><th class="zahl">Nicht verrechenbar</th><th>Status</th></tr></thead>
          <tbody>${a.bloecke.map(x => { const v = blockWerte(x); return `<tr${v.status==='negativ'?' class="dringend"':''}>
            <td>${esc(x.name)}</td><td class="zahl">${h(v.soll)}</td><td class="zahl">${h(v.ist)}</td>
            <td class="zahl">${h(v.rest)}</td><td class="zahl">${v.nichtVerrechenbar > 0 ? h(v.nichtVerrechenbar) : '—'}</td>
            <td>${tag(v.status)}</td></tr>`; }).join('')}</tbody>
          <tfoot><tr><th>Total</th><th class="zahl">${h(w.soll)}</th><th class="zahl">${h(w.ist)}</th>
            <th class="zahl">${h(w.rest)}</th><th class="zahl">${h(w.nichtVerrechenbar)}</th><th></th></tr></tfoot>
        </table></div>
      </section>

      <section class="card">
        <div class="card-head"><h2>Wirtschaftlichkeit bis heute</h2></div>
        <div class="card-body">
          <section class="kpis" style="margin-bottom:0">
            ${kpi(chf(w.ertrag),'Verrechenbarer Ertrag')}
            ${kpi(chf(w.kosten),'Stundenkosten')}
            ${kpi(chf(w.deckungsbeitrag),'Deckungsbeitrag', null, w.deckungsbeitrag >= 0 ? 'positiv' : 'negativ')}
          </section>
          ${w.risiko > 0 ? `<div class="hinweisbox negativ" style="margin:16px 0 0">
            ${h(w.nichtVerrechenbar)} geleistete Stunden sind nicht gedeckt. Ohne Nachtrag oder nachträgliche
            Rapportfreigabe entgehen der Firma rund ${chf(w.risiko)}.
          </div>` : ''}
        </div>
      </section>
    </div>

    <div class="grid">
      <section class="card">
        <div class="card-head"><h2>${w.vorlaeufig ? 'Note (Zwischenstand)' : 'Note'}</h2>
          <span class="note-wert ${w.bewertbar ? w.note.toLowerCase() : ''}">${w.bewertbar ? w.note : '—'}</span></div>
        <div class="card-body">
          <div class="kpi-wert" style="margin:0">${w.bewertbar ? Math.round(w.score) : '—'}<span style="font-size:12px;font-weight:normal;color:var(--cs-text-weich)"> von 100</span></div>
          <div class="kpi-label" style="margin-bottom:8px">Gesamtbewertung des Auftrags</div>
          ${teile.map(([n,p,g,d]) => `
            <div class="teilnote">
              <div class="teilnote-kopf"><strong>${n}</strong><span style="color:var(--cs-text-weich)">${Math.round(p)} · ${g} %</span></div>
              <div class="teilnote-bar"><i class="${p>=70?'positiv':p>=55?'warnung':'negativ'}" style="width:${Math.max(0,Math.min(100,p))}%"></i></div>
              <div class="quelle">${d}</div>
            </div>`).join('')}
          <div class="quelle" style="margin-top:10px;font-size:11px;color:var(--cs-text-weich)">A ab 85 · B ab 70 · C ab 55 · D darunter</div>
        </div>
      </section>

      <section class="card">
        <div class="card-head"><h2>Massnahmen</h2></div>
        <div class="card-body">
          ${massnahmen(a,w).map(m => `<div class="hinweisbox ${m.stufe}">${m.text}</div>`).join('') ||
            '<div style="color:var(--cs-text-weich)">Keine Auffälligkeiten. Auftrag läuft im Rahmen.</div>'}
        </div>
      </section>
    </div>
  </div>`;
}

function massnahmen(a,w){
  const out = [];
  if(w.quote > 1) out.push({stufe:'negativ', text:`Der Auftrag ist um ${h(w.ist-w.soll)} Stunden überzogen. Nachtrag beim Auftraggeber auslösen, bevor weitere Stunden geleistet werden.`});
  else if(w.quote > 0.9 && w.ist > 0) out.push({stufe:'warnung', text:'Über 90 Prozent der verkauften Stunden sind verbraucht. Restleistungen mit der Bauleitung terminieren.'});
  if(w.nichtVerrechenbar > 0) out.push({stufe:'negativ', text:`${h(w.nichtVerrechenbar)} Stunden ohne Auftragsdeckung und ohne genehmigten Rapport. Freigaben nachholen oder als Regie fakturieren.`});
  if(w.ausf > 0 && w.dokOk < w.ausf) out.push({stufe:'warnung', text:`${w.ausf - w.dokOk} Ausführungen sind unvollständig erfasst. Ohne Datum, Bemerkung und Freigabeentscheid ist die Fakturierung angreifbar.`});
  const ohneFreigabe = a.bloecke.reduce((n,b) => n + b.ausfuehrungen.filter(x => !x.genehmigt).length, 0);
  if(ohneFreigabe > 0) out.push({stufe:'warnung', text:`${ohneFreigabe} Ausführungen sind ohne dokumentierte Freigabe der Bauleitung erfasst. Bei einer Rückfrage des Auftraggebers fehlt der Nachweis.`});
  const reg = w.per.regie;
  if(reg && reg.ist === 0 && reg.soll > 0) out.push({stufe:'', text:`${h(reg.soll)} Regiestunden sind im Werkvertrag enthalten und noch nicht abgerufen. Bei Zusatzarbeiten zuerst diesen Topf belasten.`});
  return out;
}

/* ---------- Dialoge ---------- */
function modal(titel, body, fuss){
  const el = document.getElementById('modal');
  el.innerHTML = `<div class="modal" role="dialog" aria-modal="true">
    <div class="modal-head"><h3>${esc(titel)}</h3><button class="btn" onclick="modalZu()">Schliessen</button></div>
    <div class="modal-body">${body}</div>
    <div class="modal-fuss">${fuss}</div>
  </div>`;
  el.classList.add('offen');
}
function modalZu(){ const el = document.getElementById('modal'); el.classList.remove('offen'); el.innerHTML = ''; }

function auftragDialog(id){
  const a = id ? state.auftraege.find(x => x.id === id) : null;
  const f = (k,l,t='text') => `<div class="feld"><label for="f_${k}">${l}</label>
    <input id="f_${k}" type="${t}" value="${a ? esc(a[k] || '') : ''}"></div>`;
  modal(a ? 'Stammdaten bearbeiten' : 'Auftrag anlegen',
    f('objekt','Baustelle / Objekt') + f('adresse','Adresse') + f('auftraggeber','Auftraggeber') +
    f('auftragsnr','Auftragsnummer') + f('bl','Bauleitung') + f('werkvertrag','Grundlage / Werkvertrag') +
    `<div class="grid grid-2">${f('start','Beginn','date')}${f('ende','Abschluss','date')}</div>`,
    `${a ? `<button class="btn gefahr" onclick="auftragLoeschen('${a.id}')">Löschen</button>` : ''}
     <button class="btn" onclick="modalZu()">Abbrechen</button>
     <button class="btn primary-action" onclick="auftragSpeichern('${a ? a.id : ''}')">Speichern</button>`);
}

function auftragSpeichern(id){
  const g = k => document.getElementById('f_'+k).value.trim();
  const felder = { objekt:g('objekt'), adresse:g('adresse'), auftraggeber:g('auftraggeber'),
    auftragsnr:g('auftragsnr'), bl:g('bl'), werkvertrag:g('werkvertrag'), start:g('start'), ende:g('ende') };
  if(!felder.objekt){ alert('Bitte die Baustelle benennen.'); return; }
  if(id){ Object.assign(state.auftraege.find(x => x.id === id), felder); }
  else { const a = neuerAuftrag(felder); state.auftraege.push(a); ui.auftragId = a.id; ui.ansicht = 'auftrag'; }
  save(); modalZu(); render();
}

function auftragLoeschen(id){
  if(!confirm('Auftrag mit allen Rapporten löschen?')) return;
  state.auftraege = state.auftraege.filter(x => x.id !== id);
  ui.auftragId = state.auftraege[0]?.id || null; ui.ansicht = 'portfolio';
  save(); modalZu(); render();
}

function posDialog(key){
  modal('Position hinzufügen',
    `<div class="feld"><label for="p_n">Bezeichnung</label><input id="p_n" placeholder="z. B. Baureinigung 3. OG"></div>
     <div class="feld"><label for="p_s">Stunden zur Verfügung</label><input id="p_s" type="number" step="0.25"></div>`,
    `<button class="btn" onclick="modalZu()">Abbrechen</button>
     <button class="btn primary-action" onclick="posSpeichern('${key}')">Hinzufügen</button>`);
}

function posSpeichern(key){
  const n = document.getElementById('p_n').value.trim();
  const s = num(document.getElementById('p_s').value);
  if(!n){ alert('Bitte eine Bezeichnung eingeben.'); return; }
  auftrag().bloecke.find(b => b.key === key).positionen.push({ id:uid(), name:n, soll:s });
  save(); modalZu(); render();
}

function posLoeschen(key,pid){
  const b = auftrag().bloecke.find(x => x.key === key);
  if(b.ausfuehrungen.some(a => a.posId === pid)){
    if(!confirm('Zu dieser Position sind Stunden erfasst. Trotzdem entfernen?')) return;
    b.ausfuehrungen = b.ausfuehrungen.filter(a => a.posId !== pid);
  }
  b.positionen = b.positionen.filter(p => p.id !== pid);
  save(); render();
}

function setzePauschal(key,v){
  auftrag().bloecke.find(b => b.key === key).sollPauschal = num(v);
  save(); render();
}

function erfassenDialog(key){
  const b = auftrag().bloecke.find(x => x.key === key);
  modal('Stunden erfassen · ' + b.name,
    `<div class="feld"><label for="e_p">Position</label>
       <select id="e_p"><option value="">Ganzer Block</option>
         ${b.positionen.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div>
     <div class="grid grid-2">
       <div class="feld"><label for="e_d">Ausführungsdatum</label><input id="e_d" type="date" value="${heute()}"></div>
       <div class="feld"><label for="e_h">Stunden benötigt</label><input id="e_h" type="number" step="0.25">
         <span class="hilfe">In Viertelstunden erfassen</span></div>
     </div>
     <label class="pruef"><input type="checkbox" id="e_ent" checked> Ausführung im Auftrag enthalten</label>
     <label class="pruef"><input type="checkbox" id="e_gen"> Rapport durch Bauleitung genehmigt</label>
     <div class="feld"><label for="e_bem">Welche Arbeiten wurden ausgeführt?</label><textarea id="e_bem"></textarea></div>`,
    `<button class="btn" onclick="modalZu()">Abbrechen</button>
     <button class="btn primary-action" onclick="erfassenSpeichern('${key}')">Rapport speichern</button>`);
}

function erfassenSpeichern(key){
  const b = auftrag().bloecke.find(x => x.key === (key || ui.tab));
  const st = num(document.getElementById('e_h').value);
  if(st <= 0){ alert('Bitte die geleisteten Stunden eingeben.'); return; }
  b.ausfuehrungen.push({
    id:uid(),
    posId: document.getElementById('e_p').value || null,
    datum: document.getElementById('e_d').value,
    stunden: st,
    enthalten: document.getElementById('e_ent').checked,
    genehmigt: document.getElementById('e_gen').checked,
    bemerkung: document.getElementById('e_bem').value.trim()
  });
  save();
  if(key){ modalZu(); render(); }
  else { render(); const m = document.getElementById('e_msg'); if(m) m.innerHTML = '<span class="tag positiv">Gespeichert</span>'; }
}

function ausLoeschen(key,aid){
  const b = auftrag().bloecke.find(x => x.key === key);
  b.ausfuehrungen = b.ausfuehrungen.filter(x => x.id !== aid);
  save(); render();
}

/* ---------- Sichern und Laden ---------- */
function exportJSON(){
  const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
  const u = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = u; a.download = 'auftragsbewertung_' + heute() + '.json'; a.click();
  URL.revokeObjectURL(u);
}
function importJSON(input){
  const f = input.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => { try{ const d = JSON.parse(r.result); if(!d.auftraege) throw 0;
    state = d; ui.auftragId = state.auftraege[0]?.id || null; save(); render();
  }catch(e){ alert('Die Datei konnte nicht gelesen werden.'); } };
  r.readAsText(f);
}
function zuruecksetzen(){
  if(!confirm('Alle Eingaben verwerfen und den Startbestand laden?')) return;
  state = seed(); ui.auftragId = state.auftraege[0].id; save(); render();
}

/* ---------- Steuerung ---------- */
function go(v){ ui.ansicht = v; document.getElementById('sidebar').classList.remove('offen'); window.scrollTo(0,0); render(); }
function oeffne(id){ ui.auftragId = id; ui.ansicht = 'auftrag'; ui.tab = 'bau';
  document.getElementById('sidebar').classList.remove('offen'); window.scrollTo(0,0); render(); }

function render(){
  renderSidebar();
  const v = { portfolio:ansichtPortfolio, auftrag:ansichtAuftrag, erfassung:ansichtErfassung,
              bericht:ansichtBericht, einstellungen:ansichtEinstellungen }[ui.ansicht] || ansichtPortfolio;
  document.getElementById('ansicht').innerHTML = v();
}

render();
</script>
</body>
</html>
